name: Sonarqube Pipeline

on: 
 workflow_dispatch: 
 pull_request: 
  branches: ["main"]

jobs:
  sonarqube:
   runs-on: [self-hosted,siva_runner]
   steps:
     - name: Checkout Code
       uses: actions/checkout@v7

     - name: Run Sonarqube analysis
       uses: SonarSource/sonarqube-scan-action@v7
       with:
        args: >
         -Dsonar.projectKey=NodeApp-Demo
         -Dsonar.sources=.
         -Dsonar.quality.wait=true
       env:
        SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
        SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}
        
     
